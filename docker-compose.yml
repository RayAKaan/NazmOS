# Production-like local / staging stack for NazmOS.
# Use docker compose -f docker-compose.yml -f docker-compose.override.yml up for local dev tweaks.
version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nazmos
      POSTGRES_PASSWORD: nazmos_dev
      POSTGRES_DB: nazmos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazmos -d nazmos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://nazmos:nazmos_dev@postgres:5432/nazmos
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
      USE_REDIS: "true"
      CORS_ORIGINS: "https://app.nazm.ai,https://nazm.ai,http://localhost:3000"
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: "7"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./scripts:/app/scripts:ro
      - backup_data:/app/backups
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://nazmos:nazmos_dev@postgres:5432/nazmos
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app", "worker", "-l", "info", "-Q", "celery,forecasting,ingestion,analytics,dead_letter"]

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://nazmos:nazmos_dev@postgres:5432/nazmos
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app", "beat", "-l", "info"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        API_URL: ${API_URL:-http://api:8000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CHAT_ENABLED: ${NEXT_PUBLIC_CHAT_ENABLED:-false}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NazmOS KSA}
        NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-SAR}
        NEXT_PUBLIC_LOCALE: ${NEXT_PUBLIC_LOCALE:-ar-SA}
    image: ${FRONTEND_IMAGE:-ghcr.io/nazmak/nazmos-frontend:latest}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_URL: ${API_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_CHAT_ENABLED: ${NEXT_PUBLIC_CHAT_ENABLED:-false}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NazmOS KSA}
      NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-SAR}
      NEXT_PUBLIC_LOCALE: ${NEXT_PUBLIC_LOCALE:-ar-SA}
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  backup_data:
