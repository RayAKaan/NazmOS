# NazmOS SQLite mode — zero-cost local deployment
# No PostgreSQL, no Redis, no Celery.
# Backend runs with USE_TEMPORAL=false + DATABASE_URL=sqlite+aiosqlite:///./nazmos.db
# (upload/pos/event executions use the local deterministic runner; there is no
#  queue-based substrate to fail).
# Usage: docker compose -f docker-compose.sqlite.yml up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./nazmos.db
      SECRET_KEY: sqlite-local-dev-key-change-in-production-minimum-32-chars
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      USE_TEMPORAL: "false"
      USE_REDIS: "false"