# Targeted fix for the Phase 4D worker container.
#
# The live stack (project `nazmos_latest_merged`) was created from
# `docker-compose.yml` alone, so the worker's DATABASE_URL still carries the
# pre-v5 password `nazmos_dev`. The local Postgres actually authenticates with
# `nazmos_v5_dev` (temporal's own POSTGRES_PWD and docker-compose.local.yml
# both use it). Merging the full local override would also relocate the worker
# onto the `nazmos_default_net` network / different volumes, so this override
# ONLY patches the worker service: same network, same volumes, rebuilt image
# from the current backend source (which now registers the business_cycle_*
# activities + CycleRunWorkflow that the base image predates).
services:
  nazmos-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://nazmos:nazmos_v5_dev@postgres:5432/nazmos
      REDIS_URL: redis://redis:6379/0
      USE_TEMPORAL: "true"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: nazm-execution
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped
    command: ["python", "-m", "app.orchestration.temporal.worker"]