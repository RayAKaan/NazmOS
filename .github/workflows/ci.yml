name: NazmOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install security scanning tools
        run: |
          pip install --upgrade pip
          pip install bandit[toml]
          GITLEAKS_VERSION=8.18.4
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          bandit --version
      - name: Bandit SAST (medium+ severity)
        run: bandit -r backend/app --exit-zero -f json -o bandit.json
      - name: Fail on medium+ bandit findings
        run: |
          python - <<'PY'
          import json, sys
          try:
              with open('bandit.json') as f:
                  data = json.load(f)
          except Exception:
              print('No bandit report found; skipping SAST gate.')
              sys.exit(0)
          issues = [i for i in data.get('results', []) if (i.get('issue_severity') or '').upper() in ('MEDIUM','HIGH')]
          if issues:
              print('Bandit findings (medium+ severity):')
              for i in issues:
                  print(f"  [{i.get('issue_severity')}] {i.get('filename')}:{i.get('line_number')} - {i.get('issue_text')}")
              sys.exit(1)
          print('No medium+ Bandit findings.')
          PY
      - name: Gitleaks secret scan
        run: gitleaks detect --source="." --config=.gitleaks.toml --verbose

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nazmos
          POSTGRES_PASSWORD: nazmos_dev
          POSTGRES_DB: nazmos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Lint and compile backend
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q app tests
          python -m compileall -q ../scripts
          python -m alembic heads
      - name: Dependency vulnerability scan
        run: |
          python -m pip install pip-audit
          pip-audit --desc --format=json -r backend/requirements.txt > pip-audit.json || true
          pip-audit --desc -r backend/requirements.txt

      - name: Block CI on high/critical CVEs
        run: |
          python - <<'PY'
          import json, sys
          try:
              with open('pip-audit.json') as f:
                  report = json.load(f)
          except Exception:
              print('No pip-audit report found; skipping CVE gate.')
              sys.exit(0)

          failures = []
          for dep in report.get('dependencies', []):
              for vuln in dep.get('vulns', []):
                  severity = (vuln.get('severity') or '').lower()
                  if severity in ('high', 'critical'):
                      failures.append({
                          'package': dep.get('name'),
                          'version': dep.get('version'),
                          'vuln_id': vuln.get('id'),
                          'severity': severity,
                          'fix_versions': vuln.get('fix_versions', []),
                      })

          if failures:
              print('HIGH/CRITICAL CVEs detected:')
              for f in failures:
                  print(f"  {f['package']} {f['version']}: {f['vuln_id']} ({f['severity']}) fix: {f['fix_versions']}")
              sys.exit(1)
          print('No high/critical CVEs detected.')
          PY
      - name: Backend tests with PostgreSQL
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://nazmos:nazmos_dev@localhost:5432/nazmos_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          python -m alembic upgrade head
          pytest -q

      - name: Backend runtime E2E smoke tests
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://nazmos:nazmos_dev@localhost:5432/nazmos_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          USE_CELERY: false
          USE_REDIS: false
          API_BASE_URL: http://localhost:8000
          FOUNDER_EMAILS: pilot-test@example.com,demo-retail@example.com
        run: |
          python -m alembic upgrade head
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          SERVER_PID=$!
          sleep 3
          python ../scripts/runtime_e2e_upload_money_audit.py
          python ../scripts/runtime_e2e_demo_ksa_retail.py
          kill $SERVER_PID

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint, build, audit
        working-directory: frontend
        run: |
          npm run lint
          npm run build
          npm audit --audit-level=moderate --omit=dev
      - name: Frontend unit tests (Jest + RouteGuard access-control)
        working-directory: frontend
        run: |
          npm test -- --ci --runInBand
      - name: Frontend route/link integrity check
        working-directory: frontend
        run: node scripts/check_frontend_routes.mjs
      - name: Frontend axe accessibility scan (static pages)
        working-directory: frontend
        run: node scripts/check_a11y.mjs

  token-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test the token guard (positive & negative cases)
        working-directory: frontend
        run: node scripts/check_legacy_tokens.mjs --self-test
      - name: Ban forbidden design tokens in PR diff
        working-directory: frontend
        run: |
          set -o pipefail
          # Forbidden class tokens. Matched as whole word-boundary tokens so
          # canonical classes (border-border, bg-background, text-foreground,
          # bg-primary, text-primary, bg-secondary, text-secondary) never match.
          # border-border-primary/-secondary are legacy double forms; the actual
          # regressions were border-primary/border-secondary — both are rejected.
          PATTERNS='\bbg-navy-|\btext-navy-|\bborder-navy-|\bbg-bg-|\btext-text-|\bbg-status-|\btext-status-|\bborder-status-|\bbg-chart-literals-|\btext-chart-literals-|\bborder-border-primary\b|\bborder-border-secondary\b|\bborder-primary\b|\bborder-secondary\b'
          REF="${GITHUB_BASE_REF:-origin/main}"
          DIFF=$(git diff "$REF...HEAD" -- '*.tsx' '*.ts' '*.jsx' '*.js' '*.css' 2>/dev/null || true)
          COMMIT_DIFF=$(git diff "HEAD^..HEAD" -- '*.tsx' '*.ts' '*.jsx' '*.js' '*.css' 2>/dev/null || true)
          HITS=$(printf '%s\n%s\n' "$DIFF" "$COMMIT_DIFF" | grep -oE "$PATTERNS" | sort -u || true)
          if [ -n "$HITS" ]; then
            echo "::error::Forbidden design-token class(es) found in diff: $(echo "$HITS" | tr '\n' ' ')"
            echo "Migrate these to the canonical semantic Token layer. See frontend/design-tokens/README.md and run:"
            echo "  npm run build:tokens   (regenerate tailwind + globals from tokens.json)"
            echo "  node scripts/token-migration/migrate.ts   (codemod)"
            exit 1
          fi
          echo "No forbidden design-token classes in diff."
