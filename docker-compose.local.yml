services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nazmos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nazmos_v5_dev}
      POSTGRES_DB: nazmos
    ports: ["5432:5432"]
    volumes: [nazmos_pgdata_local:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazmos -d nazmos"]
      interval: 3s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [nazmos_redisdata_local:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build: {context: ./backend, dockerfile: Dockerfile}
    environment: &runtime_env
      ENVIRONMENT: runtime_test
      DATABASE_URL: postgresql+asyncpg://nazmos:${DB_PASSWORD:-nazmos_v5_dev}@postgres:5432/nazmos
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
      USE_REDIS: "true"
      SECRET_KEY: ${SECRET_KEY:-nazmos-v5-runtime-secret-change-before-production-32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DATABASE_APP_ROLE: ${DATABASE_APP_ROLE:-}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:-}
      UPLOAD_DIR: /app/uploads
      USE_MOCK_LLM: ${USE_MOCK_LLM:-false}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL:-gemini-2.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-google,mock}
      AI_CALL_LEDGER_PATH: /app/tmp/v12_ai_calls.jsonl
      # Phase A isolation core: route OpenCode brain calls to the dedicated
      # runner container; sign ReasoningCapsules.
      OPENCODE_RUNNER_URL: http://opencode_runner:8010
      NAZMOS_CAPSULE_SIGNING_KEY: ${NAZMOS_CAPSULE_SIGNING_KEY:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-mock}
      AUTH_LOGIN_LIMIT_PER_5MIN: ${AUTH_LOGIN_LIMIT_PER_5MIN:-200}
      UPLOAD_LIMIT_PER_5MIN: ${UPLOAD_LIMIT_PER_5MIN:-200}
      AUTH_REGISTER_LIMIT_PER_5MIN: ${AUTH_REGISTER_LIMIT_PER_5MIN:-200}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
  backend:
    build: {context: ./backend, dockerfile: Dockerfile}
    ports: ["8000:8000"]
    environment: *runtime_env
    depends_on:
      migrate: {condition: service_completed_successfully}
      opencode_runner: {condition: service_healthy}
    networks:
      - default
      - opencode_net
    volumes:
      - nazmos_uploads_local:/app/uploads
      - ./backend/tmp:/app/tmp
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/ready"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 30s
  celery_worker:
    build: {context: ./backend, dockerfile: Dockerfile}
    environment: *runtime_env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: [nazmos_uploads_local:/app/uploads]
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=2", "--queues=celery,ingestion,forecasting,analytics,dead_letter"]
  celery_beat:
    build: {context: ./backend, dockerfile: Dockerfile}
    environment: *runtime_env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
  # Phase A isolation core: dedicated OpenCode runner.
  # - internal network only (opencode_net): cannot reach postgres/redis or the
  #   default-network services; no published host ports.
  # - read-only rootfs, ALL caps dropped, no-new-privileges, resource limits.
  # - never mounted merchant data; its only job is the OpenCode CLI.
  opencode_runner:
    build: {context: ./backend, dockerfile: Dockerfile.opencode-runner}
    environment:
      PORT: "8010"
      ENVIRONMENT: runtime_test
      NAZMOS_OPENCODE_MODEL: ${NAZMOS_OPENCODE_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    networks: [opencode_net]
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 2s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_URL: http://backend:8000
        NEXT_PUBLIC_CHAT_ENABLED: "true"
        NEXT_PUBLIC_APP_NAME: NazmOS
        NEXT_PUBLIC_CURRENCY: SAR
        NEXT_PUBLIC_LOCALE: en
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CHAT_ENABLED: "true"
      NEXT_PUBLIC_APP_NAME: NazmOS
      NEXT_PUBLIC_CURRENCY: SAR
      NEXT_PUBLIC_LOCALE: en
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  nazmos_pgdata_local:
  nazmos_redisdata_local:
  nazmos_uploads_local:

networks:
  default:
    name: nazmos_default_net
  # Internal-only network for the OpenCode runner: no host ingress, and the
  # runner cannot reach services on the default network.
  opencode_net:
    name: nazmos_opencode_net
    internal: true
