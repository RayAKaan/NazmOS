services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nazmos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nazmos_v5_dev}
      POSTGRES_DB: nazmos
    ports: ["5432:5432"]
    volumes: [nazmos_pgdata_local:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazmos -d nazmos"]
      interval: 3s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [nazmos_redisdata_local:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 3s
      timeout: 3s
      retries: 30
  # Real Temporal dev server (docker-compose variant of the CLI dev-server used
  # by the local test suite). Self-contained file persistence; no extra DB.
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless"]
    ports: ["7233:7233"]
  migrate:
    build: {context: ./backend, dockerfile: Dockerfile}
    environment: &runtime_env
      ENVIRONMENT: runtime_test
      DATABASE_URL: postgresql+asyncpg://nazmos:${DB_PASSWORD:-nazmos_v5_dev}@postgres:5432/nazmos
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      # Durable execution substrate: every execution route is real Temporal.
      # No silent local fallback — Temporal unavailability is an operational error.
      USE_TEMPORAL: "true"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: nazm-execution
      SECRET_KEY: ${SECRET_KEY:-nazmos-v5-runtime-secret-change-before-production-32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DATABASE_APP_ROLE: ${DATABASE_APP_ROLE:-}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:-}
      UPLOAD_DIR: /app/uploads
      USE_MOCK_LLM: ${USE_MOCK_LLM:-false}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL:-gemini-2.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-google,mock}
      AI_CALL_LEDGER_PATH: /app/tmp/v12_ai_calls.jsonl
      NAZMOS_CAPSULE_SIGNING_KEY: ${NAZMOS_CAPSULE_SIGNING_KEY:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-mock}
      AUTH_LOGIN_LIMIT_PER_5MIN: ${AUTH_LOGIN_LIMIT_PER_5MIN:-200}
      UPLOAD_LIMIT_PER_5MIN: ${UPLOAD_LIMIT_PER_5MIN:-200}
      AUTH_REGISTER_LIMIT_PER_5MIN: ${AUTH_REGISTER_LIMIT_PER_5MIN:-200}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
  backend:
    build: {context: ./backend, dockerfile: Dockerfile}
    ports: ["8000:8000"]
    environment: *runtime_env
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_started}
    networks:
      - default
    volumes:
      - nazmos_uploads_local:/app/uploads
      - ./backend/tmp:/app/tmp
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/ready"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 30s
  # NazmOS execution worker: hosts every workflow + activity against the real
  # Temporal server. The ONLY orchestrator for business execution paths; it
  # must be running or executions fail loudly (no local downgrade).
  nazmos-worker:
    build: {context: ./backend, dockerfile: Dockerfile}
    environment: *runtime_env
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_started}
    restart: unless-stopped
    command: ["python", "-m", "app.orchestration.temporal.worker"]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_URL: http://backend:8000
        NEXT_PUBLIC_CHAT_ENABLED: "true"
        NEXT_PUBLIC_APP_NAME: NazmOS
        NEXT_PUBLIC_CURRENCY: SAR
        NEXT_PUBLIC_LOCALE: en
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CHAT_ENABLED: "true"
      NEXT_PUBLIC_APP_NAME: NazmOS
      NEXT_PUBLIC_CURRENCY: SAR
      NEXT_PUBLIC_LOCALE: en
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "ip=$$(hostname -i); wget --spider -q http://$$ip:3000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  nazmos_pgdata_local:
  nazmos_redisdata_local:
  nazmos_uploads_local:

networks:
  default:
    name: nazmos_default_net
